aid: 10icommerceservicespvtltd
name: 10i Commerce Services Pvt Ltd (ShopX)
description: >-
  10i Commerce Services Pvt Ltd, trading as ShopX, was a Bengaluru-based Indian B2B
  e-commerce enabler founded in 2015 by Amit Sharma and Apoorva Jois. It built an
  assisted-commerce network for kirana stores and small SME retailers, giving them
  sourcing, supply-chain, logistics and working-capital credit through a retailer-facing
  mobile app, and layering consumer digital services on top of the same counter — fast
  moving consumer goods, mobile phones and accessories, mobile and DTH recharge, bus and
  flight booking, and utility bill payment. At its peak the company reported a network of
  more than 170,000 retail partners across 440-plus towns in 24 Indian states, serving
  over eight million end customers, and it later pivoted toward a Shopify-style storefront
  platform and a consumer super-app for bulk and retail buying. It raised roughly $56-60
  million from backers including Infosys co-founder Nandan Nilekani, Fung Strategic
  Holdings, Rajesh Ranavat and Kewal Nohria. In August 2022 ShopX announced it had ceased
  operations and filed for insolvency under the Insolvency and Bankruptcy Code, stating the
  business had become unviable at scale given the low margin profile of B2B retail
  distribution; a public announcement of the Corporate Insolvency Resolution Process
  followed on the IBBI register on 14 June 2023 and the registered entity
  (CIN U72200KA2015PTC079186) remains under CIRP. ShopX never operated a public developer
  program, API, SDK, webhook surface or machine-readable specification — its retailer and
  consumer products were mobile apps — and shopx.in has since become a GoDaddy parked
  domain. This profile is retained as a historical record; there is no API surface to
  enrich.
