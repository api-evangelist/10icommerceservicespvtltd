x-domain-note: >-
  shopx.in is still registered (GoDaddy, expiry 2027-05-20) but is no longer operated. The
  apex and every path beneath it return an identical 114-byte HTML stub that client-side
  redirects to /lander, GoDaddy's parking page. A control path that cannot exist
  (/this-path-does-not-exist-xyz9) returns the same 200 and the same 114 bytes, so no 200
  from this host is a document. It is deliberately NOT wired as a Website pointer and no
  WellKnown, LLMsTxt or AgentCard pointer is emitted from it. See
  well-known/10icommerceservicespvtltd-well-known.yml for the full probe.
